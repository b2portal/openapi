                    - confidence
                    - sourceType
                    - reasonCodes
                    - holdReasonCodes
                  properties:
                    status:
                      type: string
                    confidence:
                      type: number
                    sourceType:
                      type:
                        - string
                        - 'null'
                    reasonCodes:
                      type: array
                      items:
                        type: string
                    holdReasonCodes:
                      type: array
                      items:
                        type: string
                - type: 'null'
            operatorCorrection:
              oneOf:
                - $ref: '#/components/schemas/IdentityCorrectionSummary'
                - type: 'null'
            handoffOutcome:
              oneOf:
                - $ref: '#/components/schemas/IdentityHandoffSummary'
                - type: 'null'
    IntakeReviewContext:
      type: object

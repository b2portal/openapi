openapi: 3.1.0
info:
  title: B2 Portal Developer API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://b2portal.com/terms
  description: Tenant- and location-scoped RFQ intake, catalog, and draft-triage API. V1 never pushes an RFQ to CoreBridge; the response returns operator review context instead.
servers:
  - url: https://api.b2portal.com/api/v1
    description: Production
paths:
  /locations:
    get:
      tags:
        - Developer API V1
      summary: List authorized locations
      description: Returns the currently routable intersection of the key's location grants and live CoreBridge V2 locations.
      operationId: listLocations
      security:
        - developerApiKey: []
      x-required-scope: locations:read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /accounts:
    get:
      tags:
        - Developer API V1
      summary: Search customer accounts
      description: Searches accounts in one granted CoreBridge location. Results are live, bounded, and cursor-paginated; V1 does not provide an unbounded account export.
      operationId: searchAccounts
      security:
        - developerApiKey: []
      x-required-scope: directory:read
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /accounts/{accountId}:
    get:
      tags:
        - Developer API V1
      summary: Get a customer account
      description: Re-reads one exact account through the granted location's live CoreBridge connection.
      operationId: getAccount
      security:
        - developerApiKey: []
      x-required-scope: directory:read
      parameters:
        - name: accountId
          in: path
          required: true
          description: Opaque account ID returned by the directory.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /contacts:
    get:
      tags:
        - Developer API V1
      summary: List account contacts
      description: Lists or searches contacts beneath one exact account. Contact reads are never tenant-global.
      operationId: searchContacts
      security:
        - developerApiKey: []
      x-required-scope: directory:read
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /contacts/{contactId}:
    get:
      tags:
        - Developer API V1
      summary: Get an account contact
      description: Returns one contact only after revalidating that it still belongs to the supplied account.
      operationId: getContact
      security:
        - developerApiKey: []
      x-required-scope: directory:read
      parameters:
        - name: contactId
          in: path
          required: true
          description: Opaque contact ID returned by the directory.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /uploads:
    post:
      tags:
        - Developer API V1
      summary: Prepare an attachment upload
      description: Creates a constrained, tenant-owned direct-upload capability. Upload bytes directly to the returned storage destination, then confirm the upload.
      operationId: prepareUpload
      security:
        - developerApiKey: []
      x-required-scope: intakes:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareUploadRequest'
      responses:
        '201':
          description: Upload capability created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /uploads/{uploadId}/confirm:
    post:
      tags:
        - Developer API V1
      summary: Confirm an attachment upload
      description: Verifies the uploaded object's size, MIME type, ownership, and expiration before it can be attached to an intake.
      operationId: confirmUpload
      security:
        - developerApiKey: []
      x-required-scope: intakes:write
      parameters:
        - name: uploadId
          in: path
          required: true
          description: Prepared upload ID.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /intakes:
    post:
      tags:
        - Developer API V1
      summary: Create an RFQ intake
      description: Accepts notes and confirmed upload IDs, persists the intake atomically, and returns before asynchronous RFQ extraction completes.
      operationId: createIntake
      security:
        - developerApiKey: []
      x-required-scope: intakes:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntakeRequest'
      responses:
        '202':
          description: Intake accepted for processing.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedIntake'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /intakes/{intakeId}:
    get:
      tags:
        - Developer API V1
      summary: Get intake status
      description: Returns sanitized processing state for an intake owned by the key's organization and an allowed location. Replacement keys can continue in-flight work when they retain the required scope and location grant.
      operationId: getIntake
      security:
        - developerApiKey: []
      x-required-scope: intakes:read
      parameters:
        - name: intakeId
          in: path
          required: true
          description: Client-supplied intake ID.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intake'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /intakes/{intakeId}/review-context:
    get:
      tags:
        - Developer API V1
      summary: Get intake review context
      description: Returns the current pre-order review and versioned customer-resolution target before an RFQ exists.
      operationId: getIntakeReviewContext
      security:
        - developerApiKey: []
      x-required-scope: rfqs:read
      parameters:
        - name: intakeId
          in: path
          required: true
          description: Client-supplied intake ID.
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeReviewContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /intakes/{intakeId}/draft-actions:
    post:
      tags:
        - Developer API V1
      summary: Apply an intake draft action
      description: Applies one versioned pre-order review action, then resumes asynchronous intake processing. It cannot push to CoreBridge.
      operationId: applyIntakeDraftAction
      security:
        - developerApiKey: []
      x-required-scope: rfqs:write
      parameters:
        - name: intakeId
          in: path
          required: true
          description: Client-supplied intake ID.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerReviewDraftActionRequest'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeDraftActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rfqs/{rfqId}:
    get:
      tags:
        - Developer API V1
      summary: Get an RFQ
      description: Returns the current RFQ summary and optimistic draft revision for an authorized location.
      operationId: getRfq
      security:
        - developerApiKey: []
      x-required-scope: rfqs:read
      parameters:
        - name: rfqId
          in: path
          required: true
          description: B2 Portal RFQ ID.
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rfq'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rfqs/{rfqId}/review-context:
    get:
      tags:
        - Developer API V1
      summary: Get RFQ review context
      description: Returns customer resolution, line-item state, ranked QuickProduct candidates, review targets, allowed actions, and the operator review path.
      operationId: getRfqReviewContext
      security:
        - developerApiKey: []
      x-required-scope: rfqs:read
      parameters:
        - name: rfqId
          in: path
          required: true
          description: B2 Portal RFQ ID.
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /catalog/quick-products:
    get:
      tags:
        - Developer API V1
      summary: List QuickProducts
      description: Reads active QuickProducts from B2 Portal's synchronized local CoreBridge V2 catalog. This endpoint never calls CoreBridge live.
      operationId: listQuickProducts
      security:
        - developerApiKey: []
      x-required-scope: catalog:read
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /catalog/quick-products/{quickProductId}:
    get:
      tags:
        - Developer API V1
      summary: Get a QuickProduct
      description: Returns synchronized QuickProduct details and a bounded page of constituent parts.
      operationId: getQuickProduct
      security:
        - developerApiKey: []
      x-required-scope: catalog:read
      parameters:
        - name: quickProductId
          in: path
          required: true
          description: B2 Portal QuickProduct ID.
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - name: partCursor
          in: query
          schema:
            type: string
            maxLength: 2000
        - name: partLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /catalog/search:
    get:
      tags:
        - Developer API V1
      summary: Search the catalog
      description: Searches synchronized QuickProducts and returns ranked local candidates for operator or agent triage.
      operationId: searchCatalog
      security:
        - developerApiKey: []
      x-required-scope: catalog:read
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: B2 Portal CoreBridge location ID granted to the API key.
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rfqs/{rfqId}/draft-actions:
    post:
      tags:
        - Developer API V1
      summary: Apply an RFQ draft action
      description: Applies one optimistic, idempotent draft mutation such as customer resolution, QuickProduct selection, custom line creation, field edits, or review resolution. It cannot push to CoreBridge.
      operationId: applyRfqDraftAction
      security:
        - developerApiKey: []
      x-required-scope: rfqs:write
      parameters:
        - name: rfqId
          in: path
          required: true
          description: B2 Portal RFQ ID.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftActionRequest'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    developerApiKey:
      type: http
      scheme: bearer
      description: Developer API key created in Settings → Developers. MCP access tokens are not accepted.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: Unique mutation key retained for 24 hours. Reusing it with different input returns 409.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Caller trace ID. B2 Portal generates and returns one when omitted.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2000
      description: Opaque cursor returned by the previous page.
  headers:
    CorrelationId:
      description: Request correlation ID.
      schema:
        type: string
        format: uuid
    RateLimitLimit:
      description: Per-key request limit for the current operation class.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current fixed window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the current fixed window resets.
      schema:
        type: integer
        minimum: 1
    RetryAfter:
      description: Seconds to wait before retrying a limited request.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: HTTP 400 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: HTTP 401 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: HTTP 403 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: HTTP 404 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: HTTP 409 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: HTTP 413 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: HTTP 429 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: HTTP 500 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: HTTP 503 Developer API error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - correlationId
          properties:
            code:
              type: string
              enum:
                - DEVELOPER_API_INVALID_CREDENTIAL
                - DEVELOPER_API_INSUFFICIENT_SCOPE
                - DEVELOPER_API_TENANT_FORBIDDEN
                - DEVELOPER_API_LOCATION_FORBIDDEN
                - DEVELOPER_API_INVALID_INPUT
                - DEVELOPER_API_NOT_FOUND
                - DEVELOPER_API_CONFLICT
                - DEVELOPER_API_RATE_LIMITED
                - DEVELOPER_API_UNAVAILABLE
            message:
              type: string
            correlationId:
              type:
                - string
                - 'null'
              format: uuid
    Location:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - coreBridgeLocationId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        coreBridgeLocationId:
          type: integer
    LocationList:
      type: object
      additionalProperties: false
      required:
        - locations
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    DirectorySource:
      type: object
      additionalProperties: false
      required:
        - system
        - version
      properties:
        system:
          type: string
          const: corebridge
        version:
          type: string
          const: v2
    DirectoryAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - phone
        - source
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
        phone:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/DirectorySource'
    DirectoryContact:
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - name
        - email
        - phone
        - source
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
        phone:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/DirectorySource'
    AccountPage:
      type: object
      additionalProperties: false
      required:
        - accounts
        - nextCursor
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryAccount'
        nextCursor:
          type:
            - string
            - 'null'
    ContactPage:
      type: object
      additionalProperties: false
      required:
        - contacts
        - nextCursor
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryContact'
        nextCursor:
          type:
            - string
            - 'null'
    CustomerSelection:
      type: object
      additionalProperties: false
      required:
        - accountId
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 120
        contactId:
          type: string
          minLength: 1
          maxLength: 120
    AcceptedCustomerSelection:
      type: object
      additionalProperties: false
      required:
        - accountId
        - contactId
        - state
      properties:
        accountId:
          type: string
        contactId:
          type:
            - string
            - 'null'
        state:
          type: string
          const: VALIDATED
    PrepareUploadRequest:
      type: object
      additionalProperties: false
      required:
        - intakeId
        - locationId
        - fileName
        - mimeType
        - fileSize
      properties:
        intakeId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - image/avif
            - image/bmp
            - image/gif
            - image/jpeg
            - image/png
            - image/webp
        fileSize:
          type: integer
          minimum: 1
          maximum: 10485760
    PreparedUpload:
      type: object
      additionalProperties: false
      required:
        - uploadId
        - intakeId
        - locationId
        - fileName
        - mimeType
        - fileSize
        - expiresAt
        - upload
      properties:
        uploadId:
          type: string
          format: uuid
        intakeId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - image/avif
            - image/bmp
            - image/gif
            - image/jpeg
            - image/png
            - image/webp
        fileSize:
          type: integer
          minimum: 1
          maximum: 10485760
        expiresAt:
          type: string
          format: date-time
        upload:
          type: object
          additionalProperties: false
          required:
            - url
            - fields
            - fileField
          properties:
            url:
              type: string
              format: uri
            fields:
              type: object
              additionalProperties:
                type: string
            fileField:
              type: string
              const: file
    ConfirmedUpload:
      type: object
      additionalProperties: false
      required:
        - uploadId
        - confirmed
        - intakeId
      properties:
        uploadId:
          type: string
          format: uuid
        confirmed:
          type: boolean
          const: true
        intakeId:
          type: string
          format: uuid
    CreateIntakeRequest:
      type: object
      additionalProperties: false
      required:
        - intakeId
        - locationId
        - notes
        - uploadIds
      anyOf:
        - properties:
            notes:
              type: string
              pattern: \S
        - properties:
            uploadIds:
              type: array
              minItems: 1
      properties:
        intakeId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 100000
        uploadIds:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
        customerSelection:
          $ref: '#/components/schemas/CustomerSelection'
    AcceptedIntake:
      type: object
      additionalProperties: false
      required:
        - intakeId
        - state
        - handoffState
        - locationId
        - attachmentCount
        - rfqId
        - reviewId
        - reviewPath
        - reviewUrl
        - coreBridgePushAllowed
        - customerSelection
      properties:
        intakeId:
          type: string
          format: uuid
        state:
          type: string
          const: QUEUED
        handoffState:
          type: string
          const: PENDING
        locationId:
          type: string
          format: uuid
        attachmentCount:
          type: integer
          minimum: 0
          maximum: 5
        rfqId:
          type: 'null'
        reviewId:
          type: 'null'
        reviewPath:
          type: 'null'
        reviewUrl:
          type: 'null'
        coreBridgePushAllowed:
          type: boolean
          const: false
        customerSelection:
          oneOf:
            - $ref: '#/components/schemas/AcceptedCustomerSelection'
            - type: 'null'
    Intake:
      type: object
      additionalProperties: false
      required:
        - intakeId
        - createdAt
        - locationId
        - correlationId
        - notesLength
        - attachmentCount
        - state
        - draftRevision
        - handoffState
        - rfqId
        - reviewId
        - reviewPath
        - reviewUrl
        - coreBridgePushAllowed
        - customerSelection
      properties:
        intakeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        locationId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        notesLength:
          type: integer
          minimum: 0
          maximum: 100000
        attachmentCount:
          type: integer
          minimum: 0
          maximum: 5
        state:
          type: string
          enum:
            - QUEUED
            - SAVED
            - PROCESSING
            - NEEDS_REVIEW
            - COMPLETED
            - FAILED
            - EXPIRED
        draftRevision:
          type: integer
          minimum: 0
        handoffState:
          type:
            - string
            - 'null'
        rfqId:
          type:
            - string
            - 'null'
          format: uuid
        reviewId:
          type:
            - string
            - 'null'
          format: uuid
        reviewPath:
          type:
            - string
            - 'null'
        reviewUrl:
          type:
            - string
            - 'null'
          format: uri
        coreBridgePushAllowed:
          type: boolean
          const: false
        customerSelection:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - accountId
                - contactId
                - state
                - reasonCode
              properties:
                accountId:
                  type: string
                contactId:
                  type:
                    - string
                    - 'null'
                state:
                  type: string
                  enum:
                    - VALIDATED
                    - RESOLVED
                    - NEEDS_REVIEW
                reasonCode:
                  type:
                    - string
                    - 'null'
            - type: 'null'
    IdentityCandidate:
      type: object
      additionalProperties: false
      required:
        - source
        - sourceType
        - role
        - name
        - email
        - customerName
        - contactName
        - companyName
        - confidence
        - reasonCodes
        - customerId
        - contactId
        - coreBridgeContactId
      properties:
        source:
          type:
            - string
            - 'null'
        sourceType:
          type:
            - string
            - 'null'
        role:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
        customerName:
          type:
            - string
            - 'null'
        contactName:
          type:
            - string
            - 'null'
        companyName:
          type:
            - string
            - 'null'
        confidence:
          type:
            - number
            - 'null'
        reasonCodes:
          type: array
          items:
            type: string
        customerId:
          type:
            - string
            - 'null'
        contactId:
          type:
            - string
            - 'null'
        coreBridgeContactId:
          type:
            - integer
            - 'null'
          minimum: 1
    IdentityCorrectionSummary:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - customer
        - contact
        - location
        - customerProfile
        - coreBridgeAccount
      properties:
        schemaVersion:
          type: string
          const: ws4_identity_correction.v1
        customer:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - mode
                - customerId
                - name
                - email
                - companyName
              properties:
                mode:
                  type: string
                  enum:
                    - existing_customer
                    - new_customer
                customerId:
                  type:
                    - string
                    - 'null'
                name:
                  type:
                    - string
                    - 'null'
                email:
                  type:
                    - string
                    - 'null'
                  format: email
                companyName:
                  type:
                    - string
                    - 'null'
            - type: 'null'
        contact:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - mode
                - customerId
                - coreBridgeContactId
                - name
                - email
              properties:
                mode:
                  type: string
                  enum:
                    - existing_contact
                    - new_contact
                customerId:
                  type:
                    - string
                    - 'null'
                coreBridgeContactId:
                  type:
                    - integer
                    - 'null'
                  minimum: 1
                name:
                  type:
                    - string
                    - 'null'
                email:
                  type:
                    - string
                    - 'null'
                  format: email
            - type: 'null'
        location:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - coreBridgeLocationId
              properties:
                coreBridgeLocationId:
                  type: integer
                  minimum: 1
            - type: 'null'
        customerProfile:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - salespersonId

          maxLength: 500
    DraftTarget:
      description: Copy one complete versioned target unchanged from the latest review context.
      oneOf:
        - $ref: '#/components/schemas/LineItemSetTarget'
        - $ref: '#/components/schemas/CustomerReviewTarget'
        - $ref: '#/components/schemas/CommercialDocumentTarget'
        - $ref: '#/components/schemas/QuickProductBundleTarget'
      discriminator:
        propertyName: type
        mapping:
          LINE_ITEM_SET: '#/components/schemas/LineItemSetTarget'
          CUSTOMER_REVIEW: '#/components/schemas/CustomerReviewTarget'
          COMMERCIAL_DOCUMENT: '#/components/schemas/CommercialDocumentTarget'
          QUICKPRODUCT_BUNDLE: '#/components/schemas/QuickProductBundleTarget'
    DraftActionEvidence:
      type: array
      minItems: 1
      maxItems: 5

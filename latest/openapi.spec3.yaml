        shippingAddress:
          oneOf:
            - $ref: '#/components/schemas/ReviewAddress'
            - type: 'null'
        industry:
          oneOf:
            - $ref: '#/components/schemas/ReviewReference'
            - type: 'null'
        origination:
          oneOf:
            - $ref: '#/components/schemas/ReviewReference'
            - type: 'null'
        salespersonId:
          type:
            - integer
            - 'null'
          minimum: 1
    CustomerCorrection:
      type: object
      additionalProperties: false
      anyOf:
        - required:
            - customer
          properties:
            customer:
              not:
                type: 'null'
        - required:
            - contact
          properties:
            contact:
              not:
                type: 'null'
        - required:
            - location
          properties:
            location:
              not:
                type: 'null'
        - required:
            - customerProfile
          properties:
            customerProfile:
              not:
                type: 'null'
        - required:
            - coreBridgeAccount
          properties:
            coreBridgeAccount:
              not:
                type: 'null'
      properties:
        customer:
          oneOf:
            - oneOf:
                - $ref: '#/components/schemas/ExistingCustomerCorrection'
                - $ref: '#/components/schemas/NewCustomerCorrection'
              discriminator:
                propertyName: mode
                mapping:
                  existing_customer: '#/components/schemas/ExistingCustomerCorrection'
                  new_customer: '#/components/schemas/NewCustomerCorrection'
            - type: 'null'
        contact:
          oneOf:
            - oneOf:
                - $ref: '#/components/schemas/ExistingContactCorrection'
                - $ref: '#/components/schemas/CoreBridgeContactCorrection'
                - $ref: '#/components/schemas/NewContactCorrection'
              discriminator:
                propertyName: mode
                mapping:
                  existing_contact: '#/components/schemas/ExistingContactCorrection'
                  corebridge_contact: '#/components/schemas/CoreBridgeContactCorrection'
                  new_contact: '#/components/schemas/NewContactCorrection'
            - type: 'null'
        location:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - coreBridgeLocationId
              properties:
                coreBridgeLocationId:
                  type: integer
                  minimum: 1
            - type: 'null'
        customerProfile:
          oneOf:
            - $ref: '#/components/schemas/CustomerProfileCorrection'
            - type: 'null'
        coreBridgeAccount:
          oneOf:
            - oneOf:
                - $ref: '#/components/schemas/ExistingCoreBridgeAccountCorrection'
                - $ref: '#/components/schemas/CreateCoreBridgeAccountCorrection'
              discriminator:
                propertyName: mode
                mapping:
                  link_existing: '#/components/schemas/ExistingCoreBridgeAccountCorrection'
                  create_new: '#/components/schemas/CreateCoreBridgeAccountCorrection'
            - type: 'null'

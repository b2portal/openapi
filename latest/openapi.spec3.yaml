        - draftRevision
        - review
        - customerReview
        - allowedActions
        - operatorReviewRequired
        - coreBridgePushAllowed
      properties:
        intakeId:
          type: string
          format: uuid
        preOrder:
          type: boolean
          const: true
        draftRevision:
          type: integer
          minimum: 0
        review:
          type: object
          additionalProperties: false
          required:
            - id
            - kind
            - status
            - reviewPath
          properties:
            id:
              type: string
              format: uuid
            kind:
              type: string
            status:
              type: string
            reviewPath:
              type: string
        customerReview:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - target
                - id
                - status
                - reasonCode
                - reasonLabel
                - identity
              properties:
                target:
                  $ref: '#/components/schemas/CustomerReviewTarget'
                id:
                  type: string
                  format: uuid
                status:
                  type: string
                reasonCode:
                  type:
                    - string
                    - 'null'
                reasonLabel:
                  type:
                    - string
                    - 'null'
                identity:
                  $ref: '#/components/schemas/IdentityReviewDetail'
            - type: 'null'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - RESOLVE_CUSTOMER_REVIEW
        operatorReviewRequired:
          type: boolean
          const: true
        coreBridgePushAllowed:
          type: boolean
          const: false
    Rfq:

        id:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice:
          type: number
          minimum: 0
          maximum: 200000000
    MatchQuickProductAction:
      type: object
      additionalProperties: false
      description: Selects one synchronized QuickProduct for an existing line-item decision.
      required:
        - type
        - decisionId
        - decisionUpdatedAt
        - quickProductId
        - quickProductUpdatedAt
        - reason
        - evidence
      properties:
        type:
          type: string
          const: MATCH_QUICKPRODUCT
        decisionId:
          type: string
          format: uuid
        decisionUpdatedAt:
          type: string
          format: date-time
        quickProductId:
          type: string
          format: uuid
        quickProductUpdatedAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500
        evidence:
          $ref: '#/components/schemas/DraftActionEvidence'
    AddCustomLineAction:
      type: object
      additionalProperties: false
      description: Adds a new operator-visible custom line without inventing a missing price.
      required:
        - type
        - lineItemsFingerprint
        - description
        - quantity
        - unitPrice
        - reason
        - evidence
      properties:
        type:
          type: string
          const: ADD_CUSTOM_LINE
        lineItemsFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        description:
          type: string
          minLength: 1
          maxLength: 255
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
        unitPrice:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          maximum: 10000000
        reason:
          type: string
          minLength: 1
          maxLength: 500
        evidence:
          $ref: '#/components/schemas/DraftActionEvidence'
    SendAsCustomLineAction:
      type: object
      additionalProperties: false
      description: Keeps the extracted source line but sends it as a custom CoreBridge line.
      required:
        - type
        - decisionId
        - decisionUpdatedAt
        - unitPrice
        - reason
        - evidence
      properties:
        type:
          type: string
          const: SEND_AS_CUSTOM_LINE
        decisionId:
          type: string
          format: uuid
        decisionUpdatedAt:
          type: string
          format: date-time
        unitPrice:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          maximum: 10000000
        reason:
          type: string
          minLength: 1
          maxLength: 500
        evidence:
          $ref: '#/components/schemas/DraftActionEvidence'

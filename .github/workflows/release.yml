name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Lint JSON and YAML specifications
        run: npx --yes @redocly/cli@2.46.1 lint latest/openapi.spec3.json latest/openapi.spec3.yaml
      - name: Normalize YAML specification
        run: npx --yes @redocly/cli@2.46.1 bundle latest/openapi.spec3.yaml --output "$RUNNER_TEMP/openapi-from-yaml.json" --ext json
      - name: Validate public artifacts
        run: node scripts/validate-artifacts.mjs latest/openapi.spec3.json "$RUNNER_TEMP/openapi-from-yaml.json"
      - name: Build release notes
        run: |
          git fetch --tags --force
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          {
            echo ""
            echo "## OpenAPI specification version"
            echo ""
            echo "| Specification | info.version |"
            echo "| --- | --- |"
            version="$(jq -r '.info.version' latest/openapi.spec3.json)"
            echo "| latest/openapi.spec3.{json,yaml} | $version |"
          } >> "$RUNNER_TEMP/release-notes.md"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build release assets
        run: |
          cp latest/openapi.spec3.json "$RUNNER_TEMP/openapi.spec3.json"
          cp latest/openapi.spec3.yaml "$RUNNER_TEMP/openapi.spec3.yaml"
          cd "$RUNNER_TEMP"
          sha256sum openapi.spec3.json openapi.spec3.yaml > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "B2 Portal OpenAPI $GITHUB_REF_NAME" \
            "$RUNNER_TEMP/openapi.spec3.json" \
            "$RUNNER_TEMP/openapi.spec3.yaml" \
            "$RUNNER_TEMP/SHA256SUMS"
